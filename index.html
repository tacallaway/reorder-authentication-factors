<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Factor Reorder Prototype</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding-top: 5vh;
    }
    #okta-signin-widget-container {
      width: 100%;
      max-width: 400px;
    }
    /* Injected section headings inside the authenticator list.
       Widget CSS scopes everything under #okta-sign-in so we must
       include that ID to beat its specificity. */
    #okta-sign-in h3.factor-reorder-heading {
      font-size: 14px;
      font-weight: 600;
      color: #1d1d21;
      margin: 0 0 20px;
    }
    #okta-sign-in .factor-reorder-divider {
      border: none;
      border-top: 1px solid #e0e0e0;
      margin: 4px 0 16px;
    }
    #app-message {
      text-align: center;
      padding: 2rem;
      display: none;
    }
    #app-message h2 { margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div id="okta-signin-widget-container"></div>
  <div id="app-message">
    <h2>Signed in successfully</h2>
    <p>Tokens have been stored. Check the browser console for details.</p>
    <button id="logout-btn">Sign Out</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
